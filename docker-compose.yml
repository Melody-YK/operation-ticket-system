services:
  postgres:
    image: postgres:16-alpine
    container_name: ops-ticket-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ops_user
      POSTGRES_PASSWORD: ops_password
      POSTGRES_DB: ops_ticket_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops_user -d ops_ticket_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
